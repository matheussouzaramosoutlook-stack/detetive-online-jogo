<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Detetive Online 3D</title><style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#8dc5e4;font-family:Arial;color:white;touch-action:none}#ui{position:fixed;top:12px;left:12px;background:#12263adf;padding:12px;border-radius:12px;max-width:80%;font-size:14px}#controls{position:fixed;bottom:20px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:end}#pad{height:132px;width:132px;border-radius:100%;background:#ffffff55;border:2px solid #fff8;position:relative;touch-action:none}#stick{width:50px;height:50px;background:#fff9;border-radius:100%;position:absolute;top:39px;left:39px}#buttons{display:grid;gap:8px}button{background:#174f80e8;color:white;border:1px solid #fff9;border-radius:12px;padding:13px;font-weight:bold}#msg{position:fixed;top:90px;left:5%;right:5%;background:#132b43ed;padding:15px;border-radius:14px;text-align:center;display:none}#start{position:fixed;inset:0;background:linear-gradient(90deg,#07121ddd,#10233ab0),url("cidade.jpg") center/cover;display:flex;align-items:center;justify-content:center;z-index:3}#start section{text-align:center;padding:25px;max-width:400px}input{padding:13px;width:100%;margin:15px 0;border:0;border-radius:10px;font-size:16px}#start button{width:100%;background:#167a63}</style></head><body><div id="start"><section><h1>🕵️ Detetive Online</h1><p>Conheça João, explore uma cidade em terceira pessoa, converse com testemunhas, dirija e resolva o mistério!</p><input id="name" placeholder="Nome do detetive"><button id="play">Começar investigação</button><p>Nova versão: personagem detalhado, ruas iluminadas e investigação</p></section></div><div id="ui"><b>🔎 Caso: Mistério do Mercado</b><div id="progress">Pistas: 0/3 • João</div><small id="objective">Procure pessoas com marcação amarela.</small></div><div id="msg"></div><div id="controls"><div id="pad"><div id="stick"></div></div><div id="buttons"><button id="talk">Conversar 🔎</button><button id="car">Entrar no carro 🚗</button><button id="solve">Resolver caso 🚓</button></div></div><script type="module">
import * as T from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const S=new T.Scene();S.background=new T.Color(0x536f8e);S.fog=new T.Fog(0x536f8e,75,175);const C=new T.PerspectiveCamera(65,innerWidth/innerHeight,.1,250),R=new T.WebGLRenderer({antialias:true});R.setSize(innerWidth,innerHeight);R.setPixelRatio(Math.min(devicePixelRatio,1.5));R.shadowMap.enabled=true;R.toneMapping=T.ACESFilmicToneMapping;R.toneMappingExposure=1.4;document.body.prepend(R.domElement);S.add(new T.HemisphereLight(0xffffff,0x46506a,1.8));const sun=new T.DirectionalLight(0xffc88b,2.6);sun.position.set(-30,65,20);sun.castShadow=true;S.add(sun);const m=c=>new T.MeshStandardMaterial({color:c,roughness:.85});function block(x,y,z,w,h,d,color){let a=new T.Mesh(new T.BoxGeometry(w,h,d),m(color));a.position.set(x,y,z);a.receiveShadow=true;a.castShadow=true;S.add(a);return a}block(0,-.2,0,210,.3,210,0x689457);for(let i=-2;i<=2;i++){block(i*30,0,0,10,.1,210,0x3a4048);block(0,0,i*30,210,.1,10,0x3a4048);for(let j=-100;j<100;j+=12){block(i*30,.08,j,.18,.02,4,0xe5dbac);block(j,.08,i*30,4,.02,.18,0xe5dbac)}}const colors=[0xd2a58d,0xb6c5c8,0xdac9a5,0xabbda2,0xc3abb4];for(let i=-3;i<3;i++)for(let j=-3;j<3;j++){let x=i*30+15,z=j*30+15,h=9+(Math.abs(i*7+j*3)%5)*3;block(x,h/2,z,17,h,17,colors[Math.abs(i*3+j*7)%5]);block(x,h+.2,z,18,.5,18,0x394552);for(let y=3;y<h;y+=4)for(let k=-1;k<=1;k++){block(x+k*4.5,y,z-8.6,2,1.7,.12,0x8bbbd0);block(x+k*4.5,y,z+8.6,2,1.7,.12,0x8bbbd0)}}// Detalhes de calçadas, iluminação pública e vegetação
for(let i=-2;i<=2;i++)for(let j=-2;j<=2;j++){let x=i*30+6,z=j*30+6;block(x,.04,z,2,.12,17,0xb3b2ad);block(x+2,.04,z,1,.12,17,0x8b9295);let pole=block(x,3,z-5,.18,6,.18,0x333c46);block(x,6.05,z-5,1.2,.25,.6,0xffdf99);let lamp=new T.PointLight(0xffcf85,5,16,2);lamp.position.set(x,5.8,z-5);S.add(lamp);let trunk=block(x+5,1.6,z+5,.6,3.2,.6,0x68513d);let crown=new T.Mesh(new T.IcosahedronGeometry(2.3,1),m(0x3e7850));crown.position.set(x+5,4.2,z+5);S.add(crown)}
function human(color){let g=new T.Group();const fabric=m(color),skin=m(0xc18a66),hair=m(0x241e1c),pants=m(0x28303a),shoes=m(0x171b22);function add(geo,material,x,y,z){let q=new T.Mesh(geo,material);q.position.set(x,y,z);q.castShadow=true;g.add(q);return q}add(new T.CapsuleGeometry(.39,.76,6,12),fabric,0,1.73,0);add(new T.CylinderGeometry(.18,.22,.22,12),skin,0,2.39,0);add(new T.SphereGeometry(.34,18,14),skin,0,2.69,0);add(new T.SphereGeometry(.35,18,12,0,Math.PI*2,0,Math.PI*.38),hair,0,2.81,0);for(let x of [-1,1]){let leg=add(new T.CapsuleGeometry(.155,.64,4,10),pants,x*.23,.68,0);leg.rotation.z=x*.035;add(new T.BoxGeometry(.36,.19,.56),shoes,x*.23,.14,-.13);let arm=add(new T.CapsuleGeometry(.13,.67,4,10),fabric,x*.53,1.73,0);arm.rotation.z=x*.13;add(new T.SphereGeometry(.14,10,8),skin,x*.58,1.17,0)}add(new T.BoxGeometry(.15,.35,.09),m(0xcba65c),0,1.94,-.42);S.add(g);return g}const P=human(0x276ca2);P.position.set(0,0,5);function auto(x,z,color,police=false){let g=new T.Group();function part(w,h,d,y,c){let q=new T.Mesh(new T.BoxGeometry(w,h,d),m(c));q.position.y=y;g.add(q)}part(3.2,.8,5,.8,color);part(2.6,1.1,2.5,1.7,0x7ea8bd);for(let x of [-1.55,1.55])for(let z of [-1.6,1.6]){let wheel=new T.Mesh(new T.CylinderGeometry(.48,.48,.28,12),m(0x171a20));wheel.rotation.z=Math.PI/2;wheel.position.set(x,.5,z);g.add(wheel)}if(police){part(1.2,.3,.5,2.4,0xe83948);part(.5,.32,.52,2.45,0x2765ec)}g.position.set(x,0,z);S.add(g);return g}let cars=[auto(4,12,0xb33e38),auto(-10,-20,0xcbbf9d),auto(34,7,0x378b78),auto(6,-25,0x235c9b,true)];let clues=[{name:'Ana',x:-5,z:7,question:'A placa do suspeito era 6 × 7. Qual o número?',answer:'42'},{name:'Rafael',x:-22,z:5,question:'Ele tinha R$ 30 e gastou R$ 12. Quanto sobrou?',answer:'18'},{name:'Policial Lima',x:6,z:-18,question:'O código tem 3 dezenas e 5 unidades. Qual é?',answer:'35'}];for(let q of clues){q.actor=human(0xb57a55);q.actor.position.set(q.x,0,q.z);q.mark=new T.Mesh(new T.TorusGeometry(.8,.13,6,24),new T.MeshBasicMaterial({color:0xffd34b}));q.mark.rotation.x=Math.PI/2;q.mark.position.set(q.x,3.5,q.z);S.add(q.mark)}for(let i=0;i<10;i++){let p=human([0x568d7a,0xb27774,0x7b77a6][i%3]);p.position.set((i%4-1.5)*23,0,(Math.floor(i/4)-1)*24+10);p.userData.base=p.position.clone();p.userData.phase=i;}
let active=false,drive=-1,angle=0,joy={x:0,y:0},keys={},found=new Set(),solved=false,velocity=0;const $=id=>document.getElementById(id);function say(t){$('msg').textContent=t;$('msg').style.display='block';clearTimeout(say.timer);say.timer=setTimeout(()=>$('msg').style.display='none',4200)}$('play').onclick=()=>{active=true;$('start').style.display='none';say('Bem-vindo, '+($('name').value||'detetive')+'! Encontre as testemunhas.')};function near(list){let pos=drive<0?P.position:cars[drive].position;return list.map((o,i)=>({i,d:pos.distanceTo(o.actor?o.actor.position:o.position)})).sort((a,b)=>a.d-b.d)[0]}$('talk').onclick=()=>{if(!active)return;if(drive>=0){say('Saia do carro para conversar.');return}let n=near(clues);if(n.d>5){say('Aproxime-se de alguém marcado em amarelo.');return}let q=clues[n.i];if(found.has(n.i)){say(q.name+': Já contei tudo que sei.');return}let answer=prompt(q.name+': '+q.question);if(answer===null)return;if(answer.trim()===q.answer){found.add(n.i);q.mark.visible=false;$('progress').textContent='Pistas: '+found.size+'/3';say('Pista encontrada! '+(found.size===3?'Agora toque em Resolver caso.':'Procure outra testemunha.'))}else say('Resposta incorreta. Tente novamente.')};$('car').onclick=()=>{if(!active)return;if(drive>=0){P.position.copy(cars[drive].position).add(new T.Vector3(3,0,0));P.visible=true;drive=-1;$('car').textContent='Entrar no carro 🚗';say('Você saiu do carro.');return}let n=near(cars);if(n.d>7){say('Chegue perto de um carro.');return}drive=n.i;P.visible=false;angle=cars[drive].rotation.y;$('car').textContent='Sair do carro';say('Agora você pode dirigir!')};$('solve').onclick=()=>{if(found.size<3){say('Encontre as três pistas primeiro!');return}if(solved)return;solved=true;$('objective').textContent='Caso concluído! Polícia acionada.';say('🚓 Caso resolvido! A polícia está chegando para prender o suspeito.');};const pad=$('pad'),stick=$('stick');function move(e){let r=pad.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,d=Math.max(40,Math.hypot(x,y));joy={x:x/d,y:y/d};stick.style.transform=`translate(${joy.x*39}px,${joy.y*39}px)`}pad.onpointerdown=e=>{pad.setPointerCapture(e.pointerId);move(e)};pad.onpointermove=e=>{if(e.buttons)move(e)};pad.onpointerup=pad.onpointercancel=()=>{joy={x:0,y:0};stick.style.transform=''};onkeydown=e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='e')$('talk').click();if(e.key.toLowerCase()==='f')$('car').click()};onkeyup=e=>keys[e.key.toLowerCase()]=false;onresize=()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)};let last=performance.now(),time=0;function frame(now){requestAnimationFrame(frame);let dt=Math.min((now-last)/1000,.05);last=now;time+=dt;if(active){let turn=joy.x+(keys.a||keys.arrowleft?-1:0)+(keys.d||keys.arrowright?1:0),go=-joy.y+(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0);angle-=turn*dt*(drive<0?2.5:1.7);let obj=drive<0?P:cars[drive];obj.rotation.y=angle;velocity+=(go*(drive<0?6:12)-velocity)*Math.min(1,dt*4);obj.position.x-=Math.sin(angle)*velocity*dt;obj.position.z-=Math.cos(angle)*velocity*dt;obj.position.x=T.MathUtils.clamp(obj.position.x,-100,100);obj.position.z=T.MathUtils.clamp(obj.position.z,-100,100)}for(let q of clues)q.mark.position.y=3.5+.15*Math.sin(time*3);if(solved)cars[3].position.lerp(new T.Vector3(-18,0,5),Math.min(1,dt*.5));let pos=drive<0?P.position:cars[drive].position,d=drive<0?9:14;C.position.lerp(new T.Vector3(pos.x+Math.sin(angle)*d,pos.y+(drive<0?5:8),pos.z+Math.cos(angle)*d),.12);C.lookAt(pos.x,pos.y+1.5,pos.z);R.render(S,C)}requestAnimationFrame(frame);
