<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Detetive Online — Cidade 3D</title><style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#172a39;color:white;font:15px system-ui}canvas{display:block;touch-action:none}button,input{font:inherit}button{background:#f2b544;color:#142232;border:0;border-radius:12px;padding:12px;font-weight:800}#start{position:fixed;inset:0;z-index:9;background:linear-gradient(135deg,#0d2239,#24435b);display:grid;place-items:center;padding:16px}#panel{width:min(420px,100%);background:#101c2bf2;padding:24px;border-radius:20px;text-align:center}#panel input{width:100%;padding:14px;background:#23384d;color:white;border:1px solid #648099;border-radius:10px}.swatches{display:flex;justify-content:center;gap:12px;margin:18px}.swatch{width:38px;height:38px;border:3px solid transparent;border-radius:50%}.swatch.active{border-color:white}#hud{position:fixed;top:12px;left:12px;background:#071726c9;padding:12px;border-radius:12px;max-width:260px;font-size:13px;pointer-events:none}#hint{position:fixed;top:12px;right:12px;background:#071726c9;padding:10px;border-radius:12px;font-size:12px;max-width:130px}#controls{position:fixed;bottom:16px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}#pad{display:grid;grid-template-columns:repeat(3,53px);grid-template-rows:repeat(3,53px);gap:4px}#pad button,#actions button{pointer-events:auto;background:#102d47d9;border:1px solid #8ca6bc;color:white;touch-action:none;user-select:none;padding:0}#pad button{font-size:24px}#actions{display:flex;flex-direction:column;gap:8px}#actions button{padding:13px 16px}#modal{position:fixed;inset:0;background:#000a;z-index:7;display:none;place-items:center;padding:16px}#case{background:#15293d;padding:24px;border-radius:18px;width:min(390px,100%);text-align:center}#case input{width:100%;padding:13px;border-radius:9px;font-size:20px;text-align:center;margin:12px 0}small{color:#b8c9d6}#status{color:#f8d17a}#tip{position:fixed;bottom:205px;left:50%;transform:translateX(-50%);background:#0c1d2fd9;padding:8px 12px;border-radius:9px;font-size:12px;white-space:nowrap;pointer-events:none}@media(max-width:400px){#pad{grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px)}#hud{max-width:195px}}
</style></head><body><div id="start"><div id="panel"><h1>🕵️ Detetive Online 3D</h1><p>Cidade livre • carros • pistas • amigos</p><input id="name" maxlength="18" placeholder="Seu nome de detetive" value="Detetive"><div class="swatches" id="swatches"></div><button id="play">ENTRAR NA CIDADE</button><p><small>Visão atrás do personagem, estilo GTA leve.</small></p></div></div><div id="hud"><b>🕵️ DETETIVE ONLINE</b><div id="online">Conectando...</div><div id="mission">Missão: vá até a delegacia e investigue</div><div id="status"></div></div><div id="hint">🕹️ Setas: andar<br>🚗 Ação: entrar/sair<br>🔎 Caso: investigar</div><div id="tip">Explore a cidade em terceira pessoa</div><div id="controls"><div id="pad"><span></span><button data-key="up">▲</button><span></span><button data-key="left">◀</button><button data-key="down">▼</button><button data-key="right">▶</button><span></span><span></span></div><div id="actions"><button id="action">🚗 ENTRAR</button><button id="investigate">🔎 CASO</button></div></div><div id="modal"><div id="case"><h2>🔎 Investigação matemática</h2><p id="question"></p><input id="answer" inputmode="numeric" type="number" placeholder="Sua resposta"><button id="check">VERIFICAR</button> <button id="close">FECHAR</button><p id="feedback"></p></div></div><script src="/socket.io/socket.io.js"></script><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const $=id=>document.getElementById(id), colors=['#e6b24c','#3aa3d8','#db6687','#79c77a','#ae87e8'];let color=colors[0];colors.forEach(c=>{const b=document.createElement('button');b.className='swatch'+(c===color?' active':'');b.style.background=c;b.onclick=()=>{color=c;document.querySelectorAll('.swatch').forEach(e=>e.classList.remove('active'));b.classList.add('active')};$('swatches').append(b)});
const scene=new THREE.Scene();scene.background=new THREE.Color('#89b9d5');scene.fog=new THREE.Fog('#89b9d5',85,215);const camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.1,350);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=false;document.body.prepend(renderer.domElement);scene.add(new THREE.HemisphereLight(0xe8f5ff,0x54654d,2.1));const sun=new THREE.DirectionalLight(0xffe4bc,2);sun.position.set(-35,75,30);scene.add(sun);
const mat=(c)=>new THREE.MeshLambertMaterial({color:c});const grass=mat('#709b63'),road=mat('#414e5a'),walk=mat('#b8b7ae'),line=mat('#e8cf84');function cube(w,h,d,m,x,y,z){const a=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);a.position.set(x,y,z);scene.add(a);return a}cube(260,.2,260,grass,0,-.15,0);for(let p=-90;p<=90;p+=30){cube(260,.08,9,road,0,.01,p);cube(9,.08,260,road,p,.015,0);for(let q=-123;q<124;q+=12){cube(3,.025,.14,line,q,.065,p);cube(.14,.025,3,line,p,.065,q)}}
const buildingColors=['#d8a18a','#b8c4ca','#d9c79b','#8faab9','#d7b8ae'];const buildings=[];for(let i=-3;i<=3;i++)for(let j=-3;j<=3;j++){const x=i*30+15,z=j*30+15;if(Math.abs(x)<20&&Math.abs(z)<20)continue;const h=7+((i*i+j*j+11)%5)*3;const b=cube(13,h,13,mat(buildingColors[Math.abs(i*7+j*3)%5]),x,h/2,z);buildings.push(b);cube(14,.3,14,mat('#4b5865'),x,h+.2,z);for(let k=2;k<h-1;k+=3)for(const side of [-1,1]){cube(1.6,1.5,.09,mat('#a5d9eb'),x+side*3.2,k,z-6.55);cube(.09,1.5,1.6,mat('#a5d9eb'),x-6.55,k,z+side*3.2)}}
function sign(text,x,z,clr){const cv=document.createElement('canvas');cv.width=512;cv.height=128;const ctx=cv.getContext('2d');ctx.fillStyle=clr;ctx.fillRect(0,0,512,128);ctx.fillStyle='white';ctx.textAlign='center';ctx.font='bold 48px sans-serif';ctx.fillText(text,256,80);const tex=new THREE.CanvasTexture(cv),mesh=new THREE.Mesh(new THREE.PlaneGeometry(10,2.5),new THREE.MeshBasicMaterial({map:tex,side:THREE.DoubleSide}));mesh.position.set(x,6,z-6.7);scene.add(mesh)}sign('DELEGACIA',15,15,'#20548a');sign('MERCADO',45,15,'#2d8264');sign('HOSPITAL',-45,15,'#a24e54');
function person(clr){const g=new THREE.Group();const shirt=mat(clr),skin=mat('#e0ad87'),pants=mat('#25354b');function part(w,h,d,m,x,y,z){const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);mesh.position.set(x,y,z);g.add(mesh)}part(.85,1.2,.48,shirt,0,1.55,0);part(.56,.6,.52,skin,0,2.48,0);part(.32,.9,.35,pants,-.23,.5,0);part(.32,.9,.35,pants,.23,.5,0);part(.26,1,.32,skin,-.6,1.48,0);part(.26,1,.32,skin,.6,1.48,0);return g}const player=person(color);scene.add(player);const npc=[];for(let i=0;i<18;i++){const n=person(colors[i%5]);n.position.set(((i*37)%180)-90,0,((i*47)%180)-90);scene.add(n);npc.push(n)}
const cars=[];function car(x,z,c){const g=new THREE.Group();const body=new THREE.Mesh(new THREE.BoxGeometry(2.4,.65,4.3),mat(c));body.position.y=.65;g.add(body);const roof=new THREE.Mesh(new THREE.BoxGeometry(1.9,.8,2.2),mat('#344957'));roof.position.set(0,1.32,-.2);g.add(roof);for(let s of [-1,1])for(let t of [-1,1]){const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.48,.48,.3,12),mat('#1c222a'));wheel.rotation.z=Math.PI/2;wheel.position.set(s*1.25,.45,t*1.35);g.add(wheel)}g.position.set(x,0,z);scene.add(g);return g}for(let i=0;i<14;i++)cars.push(car((i%7-3)*30+3,Math.floor(i/7)*60-33,colors[i%5]));
const keys={};let driving=-1,heading=0,x=0,z=0,started=false,socket,myId,others={},remoteModels={};function dist(a,b){return Math.hypot(a.x-b.x,a.z-b.z)}function nearestCar(){let best=-1,d=6;cars.forEach((c,i)=>{let v=dist(c.position,player.position);if(v<d){d=v;best=i}});return best}function action(){if(driving>=0){driving=-1;player.visible=true;$('action').textContent='🚗 ENTRAR';return}const i=nearestCar();if(i<0){$('status').textContent='Aproxime-se de um carro!';return}driving=i;player.visible=false;$('action').textContent='🚶 SAIR'}$('action').onclick=action;
for(const b of document.querySelectorAll('[data-key]')){const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;b.setPointerCapture(e.pointerId)});for(const evt of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(evt,()=>keys[k]=false)}addEventListener('keydown',e=>{if(['INPUT'].includes(document.activeElement.tagName))return;const map={ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right'};if(map[e.key]){keys[map[e.key]]=true;e.preventDefault()}if(e.key==='e')action();if(e.key==='m')showCase()});addEventListener('keyup',e=>{const map={ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right'};if(map[e.key])keys[map[e.key]]=false});
let a=3,b=5,solved=0;function showCase(){a=3+Math.floor(Math.random()*12);b=3+Math.floor(Math.random()*12);$('question').textContent=`Uma pista foi encontrada! A senha é ${a} × ${b}. Qual é o resultado?`;$('answer').value='';$('feedback').textContent='';$('modal').style.display='grid'}$('investigate').onclick=showCase;$('close').onclick=()=>$('modal').style.display='none';$('check').onclick=()=>{if(Number($('answer').value)===a*b){solved++;$('feedback').textContent='✅ Pista desbloqueada!';$('mission').textContent=`Pistas resolvidas: ${solved}. Continue explorando!`}else $('feedback').textContent='❌ Tente novamente.'};
$('play').onclick=()=>{started=true;player.children[0].material=mat(color);$('start').style.display='none';socket=io();socket.on('welcome',d=>{myId=d.id;others={};d.players.forEach(p=>{if(p.id!==myId)others[p.id]=p})});socket.on('joined',p=>others[p.id]=p);socket.on('moved',p=>others[p.id]=p);socket.on('left',id=>{delete others[id];if(remoteModels[id]){scene.remove(remoteModels[id]);delete remoteModels[id]}});socket.on('disconnect',()=>$('online').textContent='Reconectando...');socket.emit('join',{name:$('name').value,color})};
let last=performance.now(),send=0;function tick(now){requestAnimationFrame(tick);const dt=Math.min((now-last)/1000,.05);last=now;if(started){let target=driving>=0?cars[driving]:player;let turn=(keys.left?1:0)-(keys.right?1:0);let forward=(keys.up?1:0)-(keys.down?1:0);heading+=turn*dt*(driving>=0?1.8:2.7);const speed=driving>=0?19:7.5;const dx=Math.sin(heading)*forward*speed*dt,dz=-Math.cos(heading)*forward*speed*dt;target.position.x=THREE.MathUtils.clamp(target.position.x+dx,-113,113);target.position.z=THREE.MathUtils.clamp(target.position.z+dz,-113,113);target.rotation.y=-heading;if(driving>=0){player.position.copy(target.position);player.position.x+=3}else{x=player.position.x;z=player.position.z}const focus=target.position.clone();const desired=new THREE.Vector3(focus.x-Math.sin(heading)*10,6.8,focus.z+Math.cos(heading)*10);camera.position.lerp(desired,Math.min(1,dt*6));camera.lookAt(focus.x,1.7,focus.z);if(socket&&socket.connected&&now-send>95){socket.emit('move',{x:1200+target.position.x*9,y:1200+target.position.z*9,angle:heading,car:driving});send=now}Object.entries(others).forEach(([id,p])=>{if(!remoteModels[id]){remoteModels[id]=person(p.color||'#f9c44d');scene.add(remoteModels[id])}const m=remoteModels[id];m.position.lerp(new THREE.Vector3((p.x-1200)/9,0,(p.y-1200)/9),.2);m.rotation.y=-p.angle});$('online').textContent=`👥 ${Object.keys(others).length+1} jogador(es) • ${socket?.connected?'online':'conectando'}`;if(driving<0&&nearestCar()>=0)$('tip').textContent='🚗 Toque ENTRAR para dirigir';else $('tip').textContent=driving>=0?'🚗 Dirigindo — use as setas':'🔎 Explore e procure pistas'}else{camera.position.set(0,25,35);camera.lookAt(0,0,0)}renderer.render(scene,camera)}requestAnimationFrame(tick);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
